<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="الموقع الرسمي لفريق مصادر التعلم المدرسية">
<title>الرئيسية</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<main>
  <section class="hero" aria-label="أبرز المستجدات">
    <div class="zig"></div>
    <div class="wrap">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="slider" id="slider" aria-roledescription="شرائح متحركة"></div>
    </div>
  </section>

  <section class="sec wrap" id="news">
    <h2 class="sec-title">الأخبار والإنجازات</h2>
    <div class="grid" id="newsGrid"></div>

  <section class="sec alt" id="about">
    <div class="wrap about">
      <div>
        <h2 class="sec-title">من نحن</h2>
        <p id="aboutText"></p>
        <a class="btn" href="team.html">تعرّف على فريقنا</a>
      </div>
      <div class="logo-box"><img src="assets/team-logo.png" alt="شعار فريق مصادر التعلم"></div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<dialog id="dlg"></dialog>

<script src="data.js"></script>
<script src="js/common.js"></script>
<script src="js/index.js"></script>

</html>
